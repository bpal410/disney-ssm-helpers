version: 2

# Keep artifact names stable regardless of the repository (fork) name.
project_name: ssm-helpers

before:
  hooks:
    - go mod tidy
    - make test

builds:
  - id: ssm
    main: ./main.go
    binary: ssm
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'github.com/disneystreaming/ssm-helpers/cmd.version={{.Version}}' -X 'github.com/disneystreaming/ssm-helpers/cmd.commit={{.Commit}}'

archives:
  - ids:
      - ssm
    # Same names as before, e.g. ssm-helpers_1.2.3_Darwin_x86_64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

# Published to GitHub Container Registry under the owner of the repository
# running the release, using the workflow's GITHUB_TOKEN.
dockers_v2:
  - ids:
      - ssm
    dockerfile: Dockerfile
    images:
      - "ghcr.io/{{ tolower .Env.GITHUB_REPOSITORY_OWNER }}/ssm"
    tags:
      - latest
      - "{{ .Tag }}"
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64

nfpms:
  - license: MIT
    maintainer: Disney Streaming Services
    description: Helper tools for AWS Systems Manager.
    homepage: https://github.com/disneystreaming/ssm-helpers
    suggests:
      - awscli
      - session-manager-plugin
    formats:
      - rpm
      - deb

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
